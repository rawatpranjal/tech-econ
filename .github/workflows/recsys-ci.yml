name: Recsys CI

# Runs on every PR and push to main. Intentionally NO paths filter — we
# want to catch surprise regressions where a config or template change
# affects something tests didn't think it depended on.
#
# Required for merge once branch protection is configured in GitHub UI.
# See master_recsys_planner.md (Phase 0) for context.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/python/ -v

  js-tests:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Run vitest
        run: npm test

  validate-data:
    name: validate_data.py
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: pip install requests

      - name: Validate data (fields, sync, duplicates — no network link check)
        run: python scripts/validate_data.py --skip-links

  recsys-output-invariants:
    name: test_recsys_outputs.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run output invariants
        run: python scripts/test_recsys_outputs.py

  hugo-build:
    name: hugo build sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Inlined-config sanity (catches Hugo auto-escape regressions)
        run: |
          node -e '
          const fs = require("fs");
          const html = fs.readFileSync("public/index.html", "utf8");
          const m = html.match(/<script id=experiments-config[^>]*>([\s\S]*?)<\/script>/);
          if (!m) { console.error("experiments-config script tag missing"); process.exit(1); }
          const parsed = JSON.parse(m[1]);
          if (typeof parsed !== "object" || parsed === null) {
            console.error("experiments-config did not parse to an object (typeof " + typeof parsed + "). Check baseof.html safeJS pipeline.");
            process.exit(1);
          }
          if (!Array.isArray(parsed.experiments)) {
            console.error("experiments-config.experiments missing or not an array. Check data/experiments.json.");
            process.exit(1);
          }
          console.log("experiments-config OK: " + parsed.experiments.length + " experiment(s) inlined");
          '
