name: Generate Weekly Highlight

# DISABLED - requires ANTHROPIC_API_KEY secret to be configured
# To re-enable: replace the 'on:' section with:
#
# on:
#   schedule:
#     - cron: '0 0 * * 0'  # Sunday midnight UTC
#   workflow_dispatch:
#     inputs:
#       topic:
#         description: 'Specific topic to cover'
#         required: false
#         type: string

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'This workflow is DISABLED. Add ANTHROPIC_API_KEY secret first.'
        required: true
        default: 'I have added the secret'

jobs:
  generate:
    runs-on: ubuntu-latest
    if: false  # Disabled until ANTHROPIC_API_KEY is configured
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic pyyaml

      - name: Generate weekly highlight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic }}
        run: |
          python scripts/generate-highlight.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Generate weekly highlight for $(date +%Y-%m-%d)"
          git push
